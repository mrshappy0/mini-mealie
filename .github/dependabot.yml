version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      # These families pin each other with *exact* version constraints, so a
      # per-package PR always leaves the pair split across two versions and CI
      # fails on the mismatch rather than on anything the bump actually changed.
      # Grouping keeps each family in a single PR that moves in lockstep.
      groups:
          # @playwright/test@X depends on playwright@X exactly. Splitting them
          # puts two runner copies in the tree, and the spec's `@playwright/test`
          # import resolves to a different registry than the `playwright test`
          # CLI reads — every Chrome MV3 job dies with "Playwright Test did not
          # expect test.describe() to be called here" / "No tests found".
          playwright:
              patterns:
                  - 'playwright'
                  - '@playwright/test'
          # @vitest/ui and @vitest/coverage-istanbul declare `peerDependencies:
          # { vitest: "<exact version>" }`, so they are only ever installable
          # against the exact vitest release they shipped with.
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          # react-dom's peer floor tracks its own version exactly (react-dom@19.2.8
          # peers react@^19.2.8, 19.2.4 peers ^19.2.4, and so on), so a solo
          # react-dom minor bump asks for a react its sibling PR hasn't landed yet.
          # This has already cost a manual follow-up here once — see 7e2fbdf,
          # "fix(deps): align react-dom version to match react 19.2.6", after #78
          # bumped react on its own. @types/react-dom tracks @types/react the same
          # way at minor granularity, and @testing-library/react peers all four, so
          # they belong in one group rather than two.
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
