name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write

# semantic-release must never run twice concurrently (races on tags/releases).
# Queue overlapping runs instead of cancelling one mid-publish.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    semantic-release:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Run semantic-release
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
