name: Audit Dependencies

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Review Dependency Changes
              uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: moderate
                  # image-size@2.0.2 (pulled in by web-ext -> addons-linter, pinned to that exact
                  # version with no range to override) has two unpatched high-severity DoS
                  # advisories in its JXL/HEIF/ICNS parsers. No fixed release exists upstream yet.
                  # web-ext is a devDependency only — never shipped in the built extension — and
                  # `wxt dev` only invokes `web-ext run`, never the `lint`/`sign`/`build` paths
                  # that actually exercise addons-linter's image parsing. Remove this once
                  # image-size publishes a patched release and addons-linter picks it up.
                  allow-ghsas: 'GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr'
