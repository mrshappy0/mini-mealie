name: Lint & Typecheck

# Note: "Run ESLint" is a required status check on main — do not add paths-ignore
# here. A path-filtered workflow never reports its required check, which leaves
# the PR permanently blocked waiting on a status that will never arrive.

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Run ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Setup
              uses: ./.github/actions/setup

            - name: Run Typecheck (app)
              run: pnpm typecheck

            - name: Run Typecheck (e2e harnesses)
              run: pnpm typecheck:e2e

            - name: Run Linter
              run: pnpm lint
