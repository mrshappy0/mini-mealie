name: Test & Coverage

# "Run Tests" and "Check Code Coverage" are both required status checks on main,
# so both job names below must stay exactly as-is even though they now live in
# one file. The coverage job reuses the first job's coverage output instead of
# re-running the whole suite, since both used to run `pnpm test` independently
# on every PR.

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Run Tests with Coverage
              run: pnpm test --run --coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/coverage-summary.json
                  retention-days: 1

    coverage:
        name: Check Code Coverage
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Download coverage report
              uses: actions/download-artifact@v8
              with:
                  name: coverage-report
                  path: coverage

            - name: Enforce Coverage Threshold
              run: |
                  chmod +x scripts/check-coverage.sh
                  scripts/check-coverage.sh
