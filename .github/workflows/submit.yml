name: Upload Extension

on:
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    submit:
        name: Submit to Store(s)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Setup
              uses: ./.github/actions/setup

            - name: Extract release version from tag
              id: extract_version
              run: |
                  echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            - name: Inject version into package.json
              run: |
                  npm pkg set version=${{ steps.extract_version.outputs.VERSION }}

            - name: Zip Chrome extension
              run: |
                  pnpm zip

            - name: Submit to Chrome Store
              run: |
                  pnpm wxt submit \
                    --chrome-zip .output/*-chrome.zip \
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  CHROME_SKIP_SUBMIT_REVIEW: false

            - name: Zip Firefox extension
              run: |
                  pnpm zip:firefox

            - name: Submit to Firefox Add-ons
              # Must check `secrets.*` here, not `env.*` — a step's own `env:` block
              # isn't materialized until after its `if:` is evaluated, so checking
              # env.FIREFOX_JWT_ISSUER here always evaluates false.
              if: ${{ secrets.FIREFOX_JWT_ISSUER != '' }}
              run: |
                  pnpm wxt submit \
                    --firefox-zip .output/*-firefox.zip \
                    --firefox-sources-zip .output/*-sources.zip \
                    --firefox-channel=listed
              env:
                  FIREFOX_EXTENSION_ID: 'mini-mealie@shaplabs.net'
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
