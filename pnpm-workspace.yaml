# pnpm 11: project-level pnpm settings live here, not in package.json's "pnpm" field
#
# ⚠️  WATCHED DEPENDENCY: eslint-plugin-react is installed from a fork
#    (github:ledsun/eslint-plugin-react#update-deprecated-calls-v8) for
#    ESLint 10 compat. Revert to npm registry when upstream PR #3979 merges.
#    See AGENTS.md for details.
#
allowBuilds:
    esbuild: true
    spawn-sync: true

auditConfig:
    ignoreGhsas:
        # GHSA-mh99-v99m-4gvg: brace-expansion DoS, patched only at 5.0.8+.
        # Remaining instance is brace-expansion@1.1.16 via minimatch@3.1.5
        # (eslint-plugin-react, and multimatch → web-ext-run → wxt). minimatch@3.1.5
        # calls brace-expansion as `require('brace-expansion')(str)`; 5.0.8 exports
        # `{ expand }` instead, so forcing the upgrade breaks those callers (verified:
        # eslint-plugin-react's minimatch-based rules call it the same way). No
        # minimatch release backports the fix while keeping the old call shape.
        # devDependency-only: both callers match our own lint/build-time glob
        # patterns, never attacker-controlled input. The minimatch@10.2.5 instance
        # (below) is fixed directly. Revisit if eslint-plugin-react or multimatch
        # ship a minimatch@9+ upgrade.
        - GHSA-mh99-v99m-4gvg

minimumReleaseAgeExclude:
    - '@eslint/css@1.4.0'
    - '@types/chrome@0.2.1'

overrides:
    # node-notifier@10.0.1 (via wxt → web-ext-run) pins uuid@^8.3.2 which is
    # vulnerable to GHSA-w5hq-g745-h8pq. Scoped to node-notifier only so the
    # rest of the tree resolves its own preferred uuid version. node-notifier
    # only calls uuid.v4(), API-compatible across all major versions.
    node-notifier>uuid: '>=11.1.1'
    # GHSA-w7jw-789q-3m8p: shell-quote quote() newline escaping in .op values.
    # fx-runner@1.4.0 pins shell-quote@1.7.3; fx-runner@1.5.0 already uses 1.8.4
    # but web-ext-run@0.2.4 (no newer release) still depends on fx-runner@1.4.0.
    fx-runner>shell-quote: '>=1.8.4'
    # GHSA-ph9p-34f9-6g65: tmp path traversal via unsanitized prefix/postfix.
    # web-ext-run@0.2.4 pins tmp@0.2.5; no newer web-ext-run release available.
    web-ext-run>tmp: '>=0.2.6'
    # GHSA-gv7w-rqvm-qjhr / GHSA-g7r4-m6w7-qqqr: esbuild RCE via Deno binary
    # integrity bypass and arbitrary file read on Windows dev server.
    esbuild: '>=0.28.1'
    # GHSA-xcpc-8h2w-3j85: adm-zip crafted ZIP triggers 4GB memory allocation.
    # web-ext-run@0.2.4 (no newer release) pins firefox-profile which pins adm-zip@0.5.18.
    firefox-profile>adm-zip: '>=0.6.0'
    # CVE-2026-6734, CVE-2026-9697 (HIGH), CVE-2026-9679, CVE-2026-9678
    # (MEDIUM), CVE-2026-11525, CVE-2026-6733 (LOW): undici vulnerabilities
    # in versions < 7.28.0. Real path is semantic-release -> @semantic-release/npm
    # -> @actions/core -> @actions/http-client -> undici. Scoped to that parent
    # (rather than a blanket `undici:` override) so it doesn't also force
    # jsdom's own bundled undici (jsdom depends on `^7.25.0` directly) up to a
    # major version whose internals jsdom's resource loader doesn't expect —
    # jsdom gets its own >=7.28.0 floor below, capped under 8.0.0.
    '@actions/http-client>undici': '>=7.28.0'
    'jsdom>undici': '>=7.28.0 <8.0.0'
    # GHSA-v2hh-gcrm-f6hx: fast-uri host confusion via literal backslash
    # authority delimiter in versions <=3.1.3. Transitive via
    # @commitlint → ajv (no newer commitlint pin yet).
    fast-uri: '>=3.1.4'
    # GHSA-mh99-v99m-4gvg: brace-expansion DoS, patched at 5.0.8. minimatch@10.2.5
    # already calls the modern `{ expand }` API, so bumping here is a safe, direct
    # fix (see auditConfig.ignoreGhsas above for the other, incompatible instance).
    'minimatch@10.2.5>brace-expansion': '>=5.0.8'

packageExtensions:
    'minimatch@10.2.5':
        dependencies:
            brace-expansion: '^5.0.6'
